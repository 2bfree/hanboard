name: HanBoardTokyo
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  JapaneseConversion:
    path: Conversion
targets:
  HanBoardTokyo:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.befreeproject.hanboard.tokyo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    dependencies:
      - target: HanBoardKeyboard
        embed: true
  HanBoardKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Core
      - path: ../mappings/ja/kana.csv
        buildPhase: resources
      - path: ModelWeights
        includes:
          - zenz-v3-small.gguf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.befreeproject.hanboard.tokyo.keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: JapaneseConversion
        product: JapaneseConversion
schemes:
  HanBoardTokyo:
    build:
      targets:
        HanBoardTokyo: all
    run:
      config: Debug
